            justify-content: center;
            align-items: center;
            border-radius: 20%;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: absolute;
            
        }
        
        /* Positioning the input port to be attached on the left */
        .input-port {
            left: -30px;
            width: 35px; /* Slightly larger to ensure full attachment */
            height: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }
        /* Positioning output ports to be attached to the right */
        /* Style the output ports */
        .output-port {
            position: absolute;
            right: -30px;
            width: 35px; /* Ensures full attachment */
            height: 20px;
            background-color: #40da12;
            color: white;
            z-index: 1;
          
        }

        /* Add straight lines beside each output port */
        .output-port::after {
            content: "";
            position: absolute;
            left: 100%;
            top: 50%;
            width: 30px; /* Length of the line */
            height: 2px;
            background-color: blue;
            transform: translateY(-50%);
        }
        /* Add straight lines beside each input port */

            content: "";

            right: 100%;
            top: 50%;
            width: 30px; /* Length of the line */
            height: 2px;
            background-color: blue;
            transform: translateY(-50%);
        }

        /*them toggle css*/
        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-toggle input {
            display: none;
        }

        .theme-toggle label {
            display: flex;
            align-items: center;
            width: 70px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
            padding-left: 8px;
            color: #ffffff;
            transition: box-shadow 0.3s ease;
        }

        /* Fixed text inside the switch */
        .theme-toggle label .theme-text {
            position: absolute;
            left: 8px;
            font-size: 12px;
            text-transform: uppercase;
            z-index: 1;
            pointer-events: none;
        }

        /* Sliding knob (circle) */
        .theme-toggle label .knob {
            position: absolute;
            top: 2px;
            left: 5px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); /* Bouncy ease */
            z-index: 2;
        }

        /* Dark theme (checked) */
        .theme-toggle input:checked + label {
            background: transparent;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.7);
        }

        .theme-toggle input:checked + label .knob {
            left: calc(100% - 25px);
        }

        /* Light theme (unchecked) */
        .theme-toggle input:not(:checked) + label {
            background: transparent;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        /* Text change */
        .theme-toggle input:checked + label .theme-text::before {
            content: 'Dark';
        }

        .theme-toggle input:not(:checked) + label .theme-text::before {
            content: 'Light';
            color: #333;
            padding-left: 20px;
        }

        .theme-toggle input:not(:checked) + label .knob {
            background: #333;
        }

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
         const map = L.map('map',{
            maxBounds: L.latLngBounds(L.latLng(-90, -180), L.latLng(90, 180)),
            minZoom: 2.3,
            attributionControl:false
        }).setView([0, 0], 2);

        L.control.attribution({
            position: 'bottomright',
            prefix: '<a href="https://app.vetro.io/fibermap/" target="_blank">Vetro</a>' // Custom 
        }).addTo(map);


        // Define base layers
        var lightTheme =  L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], 
            attribution: '© Developed by JGN',
            maxZoom: 99
        });

        var darkTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© Developed by JGN',
            subdomains: 'abcd',
            maxZoom: 99
        });

        // Add initial layer
        darkTheme.addTo(map);

        // Handle switch toggle
        document.getElementById('themeSwitch').addEventListener('change', function (e) {
            if (e.target.checked) {
                darkTheme.addTo(map);
                lightTheme.remove();
            } else {
                lightTheme.addTo(map);
                darkTheme.remove();
            }
        });


        let firstGeoJSONCoordinates = {};
        let thirdGeoJSONFondid = [];
       

        function handleGeoJSONUpload(inputElement, isFirst, isThird) {
        const file = inputElement.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const geojson = JSON.parse(e.target.result);

                    if (isFirst) {
                        firstGeoJSONCoordinates = extractCoordinatesWithProperties(geojson);
                    } else if (isThird) {
                        // Directly add the third GeoJSON to the map without any filtering
                        const geojsonLayer = L.geoJSON(geojson, {
                            style: function(feature) {
                                let color;
                                let opacity;
                                let weight;
                                if (feature.properties.Layer === 'Fiber (Lateral)') {
                                    color = 'red';
                                    weight = 6;
                                } else if (feature.properties.Layer === 'Fiber (Distribution)') {
                                    color = 'orange';
                                    weight = 6;
                                } else {
                                    color = '#CC00FF';
                                    weight = 3;
                                }

                                return {
                                    color: color,
                                    weight: weight,
                                    opacity: 0.8
                                };
                            },
                            onEachFeature: function(feature, layer) {
                                // Add a permanent label displaying the fondid below the line
                                if (feature.properties.FondID) {
                                    layer.bindTooltip(`ID: ${feature.properties.ID}`, {
                                        permanent: false,
                                        direction: 'bottom',
                                        offset: [5, 10],  // Adjust offset to ensure visibility below the line
                                        className: 'leaflet-tooltip'
                                    }).openTooltip();
                                }
                               // Change color on mouseover
                                layer.on('mouseover', function() {
                                    layer.setStyle({
                                        color: 'yellow'
                                    });
                                });

                                // Reset color on mouseout
                                layer.on('mouseout', function() {
                                    // Reset to original color based on properties
                                    let resetColor;
                                    if (feature.properties.Layer === 'Fiber (Lateral)') {
                                        resetColor = 'red';
                                    } else if (feature.properties.Layer === 'Fiber (Distribution)') {
                                        resetColor = 'orange';
                                    } else {
                                        resetColor = '#CC00FF';
                                    }

                                    layer.setStyle({
                                        color: resetColor
                                    });
                                });
                             // Bind popup with some content (customize as needed)
                             layer.on('click', function(e) {
                                const layersAtPoint = [];
                                map.eachLayer(function(layer) {
                                    if (layer.feature && layer.getBounds && layer.getBounds().contains(e.latlng)) {
                                        layersAtPoint.push(layer);
                                    }
                                });

                                if (layersAtPoint.length > 1) {
                                    let popupContent = '<strong>Cables:</strong><div style="margin-top: 5px;">';
                                    
                                    // Counters for specific types of layers
                                    //let distributionCount = 0; 
                                    //let lateralCount = 0;
                                    //let dropCount = 0;
                                    
                                    layersAtPoint.forEach((layer,index) => {
                                        const { ID,FondID, Layer,["Material Length"]: materialLength } = layer.feature.properties;

                                        // Increment counters based on FondID

        function extractCoordinatesWithProperties(geojson) {

        function filterGeoJSONByCoordinates(geojson, coordinatesToMatch) {
            return {
                ...geojson,
                features: geojson.features.filter(feature => {
                    if (feature.geometry.type === "Point") {
                        const latlng = L.latLng(feature.geometry.coordinates[1], feature.geometry.coordinates[0]).toString();
                        return coordinatesToMatch.includes(latlng);
                    }
                    return false;
                })
            };
        }

        function mergeDRLines(lines) {
            let pattern = /(.*DR-)(\d+)(.*)/;
            let grouped = {};
        
            lines.forEach(line => {
                let match = line.match(pattern);
                if (match) {
                    let prefix = match[1];
                    let number = parseInt(match[2], 10);
                    let suffix = match[3].replace(/\bF\d*\b/g, '').trim(); // Remove 'F' occurrences after DR-xxxx
        
                    let key = `${prefix}${suffix}`;
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(number);
                } else {
                    grouped[line] = line; // Keep non-matching lines as is
                }
            });
        
            return Object.entries(grouped)
                .map(([key, values]) => {
                    if (Array.isArray(values)) {
                        values.sort((a, b) => a - b);
                        let result = [];
                        let temp = [values[0]];
        
                        for (let i = 1; i < values.length; i++) {
                            if (values[i] === values[i - 1] + 1) {
                                temp.push(values[i]);
                            } else {
                                result.push(
                                    temp.length > 1
                                        ? `${key.split("DR-")[0]}DR-${String(temp[0]).padStart(4, '0')} -> DR-${String(temp[temp.length - 1]).padStart(4, '0')}${key.split("DR-")[1].replace(/\d+/, '')}`
                                        : `${key.split("DR-")[0]}DR-${String(temp[0]).padStart(4, '0')}`
                                );
                                temp = [values[i]];
                            }
                        }
                        result.push(
                            temp.length > 1
                                ? `${key.split("DR-")[0]}DR-${String(temp[0]).padStart(4, '0')} -> DR-${String(temp[temp.length - 1]).padStart(4, '0')}${key.split("DR-")[1].replace(/\d+/, '')}`
                                : `${key.split("DR-")[0]}DR-${String(temp[0]).padStart(4, '0')}`
                        );
        
                        return result.join('<br>'); // Each group appears on a new line
                    }
                    return values;
                })
                .join('<br>');
        }

        function processLines(lines) {
            let pattern = /(.*)F(\d+(-\d+)?)\sout\s(.*)F(\d+(-\d+)?)/;
            let grouped = {};
        
            lines.forEach(line => {
                let match = line.match(pattern);
                if (match) {
                    let prefix1 = match[1].trim();
                    let number1 = match[2]; // Handles both single numbers and ranges (e.g., 25 or 28-38)
                    let prefix2 = match[4].trim();
                    let number2 = match[5];
        
                    let key = `${prefix1} F${number1} out ${prefix2}`;
                    if (!grouped[key]) grouped[key] = [];
                    
                    // If it's a range (e.g., 28-38), store as is
                    if (number2.includes('-')) {
                        grouped[key].push(number2);
                    } else {
                        grouped[key].push(parseInt(number2, 10));
                    }
                } else {
                    grouped[line] = line; // Keep non-matching lines as is
                }
            });
        
            return Object.entries(grouped)
                .map(([key, values]) => {
                    if (Array.isArray(values)) {
                        values = values.map(v => (typeof v === "string" ? v : parseInt(v, 10)));
                        values.sort((a, b) => (typeof a === "string" ? 1 : a - b));
        
                        let result = [];
                        let temp = [values[0]];
        
                        for (let i = 1; i < values.length; i++) {
                            if (
                                typeof values[i] === "number" &&
                                typeof values[i - 1] === "number" &&
                                values[i] === values[i - 1] + 1
                            ) {
                                temp.push(values[i]);
                            } else {
                                result.push(
                                    temp.length > 1
                                        ? `F${temp[0]}-F${temp[temp.length - 1]}`
                                        : `F${temp[0]}`
                                );
                                temp = [values[i]];
                            }
                        }
                        result.push(
                            temp.length > 1
                                ? `F${temp[0]}-F${temp[temp.length - 1]}`
                                : `F${temp[0]}`
                        );
        
                        return `${key} ${result.join('<br>')}`;
                    }
                    return values;
                })
                .join('<br>');
        }    
        function findInputPSCables(lines) {
            let pattern = /In\s(.*?)\s(F\d+)\sPSsplit\s(.*?)\sF\d+/;
            let inputCables = new Set();
        
            lines.forEach(line => {

        function findOutputPSplit(lines) {
            let pattern = /PSsplit\s(.*?F\d+)/;

            let valuesAfterSSSplit = [];
            let groupedValues = [];
            let currentGroup = [];
        
            lines.forEach(line => {
                let match = line.match(pattern);
                if (match) {
                    let value = match[1].trim();
                    currentGroup.push(value);
                    
                    // Move to the next group if "SS-SS#" is encountered or group size reaches 3
                    if (/^SS-SS\d+$/.test(value) || currentGroup.length === 8) {
                        groupedValues.push(currentGroup);
                        currentGroup = [];
                    }
                }
            });
        
            // Push the last group if it has remaining elements
            if (currentGroup.length > 0) {
                groupedValues.push(currentGroup);
            }
        
            return groupedValues;
        }
        function findOutputSSplit(lines) {
            let pattern = /SSsplit\s(.*?)\sF\d+/;
            let valuesAfterSSSplit = [];
            let groupedValues = [];
            let currentGroup = [];
        
            lines.forEach(line => {
                let match = line.match(pattern);
                if (match) {
                    let value = match[1].trim();
                    currentGroup.push(value);
                    
                    // Move to the next group if "SS-SS#" is encountered or group size reaches 3
                    if (/^SS-SS\d+$/.test(value) || currentGroup.length === 4) {
                        groupedValues.push(currentGroup);
                        currentGroup = [];
                    }
                }
            });
        
            // Push the last group if it has remaining elements
            if (currentGroup.length > 0) {
                groupedValues.push(currentGroup);
            }
        
            return groupedValues;
        }
        function findInputCables(lines) {
            let pattern = /In\s(.*?)\sF\d+\s(SSsplit|express|splice)\s(.*?)\sF\d+/;
            let inputCables = new Set();

            lines.forEach(line => {
                let match = line.match(pattern);

                    inputCables.add(sourceCable);

            return Array.from(inputCables); // Return unique cables as an array
        }
        function findOutputCables(lines) {
            let outputCables = new Set();

                outputCables.add(combined);

        }

                        // Display Output Cables outside the box
                        outputCables.forEach((cable, index) => {
                            let outputItem = document.createElement("div");
                            outputItem.textContent = ` ${cable}`;
                            outputItem.className = `output-item output-item-${index + 1}`; 
                            outputList8.appendChild(outputItem);

                    } else {
                        // Show Secondary Splitter (1:4)
                        splitterContainer4.style.display = "block";

                        inputPort4.innerHTML = `<span style="color: black; font-weight: bold;font-size: 12px;position: relative; left: -98px;margin-top: -13px">${inputSSCable}</span>`; // Show input cable name
                
                        splitterTitle4.classList.add("small");
                        splitterTitle8.textContent = ""; // Clear Primary Splitter title
                
                        // Display Output Cables outside the box
                        outputCables.forEach((cable, index) => {
                            let outputItem = document.createElement("div");
                            outputItem.textContent = `${cable}`;
                            outputItem.className = `output-item output-itemm-${index + 1}`;

                    }
                
                    console.log("Clicked:", handhole);
                    console.log("Input PS Cable:", inputPSCable);
                    console.log("Input SS Cable:", inputSSCable);
                    console.log("Output Cables:", outputCables);
                };
                
                
                let page5Content = "";
                
                const primaryCount = parseInt(primary, 10);
                const secondaryCount = parseInt(secondary, 10);
                const formattedHandhole = Handhole.split("-").slice(0, 3).join("-");
                
                let handholeParts = Handhole.split("-");
                if (handholeParts[handholeParts.length - 1] === "HH") {
                    handholeParts.pop();
                }
                const formathhHandhole = handholeParts.join("-");
                
                if ((!isNaN(primaryCount) && primaryCount > 0) || (!isNaN(secondaryCount) && secondaryCount > 0)) {
                    page5Content = `<div class="page-header">${Handhole}</div>
                                    <div class="page5-container">  
                                        <div class="splitter-sections">`;
                
                    // Define input cables for each primary splitter
                    let inputPSCables = processInputPSCablesData(connections);// Add more if needed
                    let outputPSCables = processOutputPSCablesData(connections);
                
                    if (!isNaN(primaryCount) && primaryCount > 0) {
                        page5Content += `<div class="splitter-section">
                                            <h3>Primary Splitters</h3>
                                            <div class="splitter-container">`;
                
                        for (let i = 1; i <= primaryCount; i++) {
                            let inputPSCable = inputPSCables[i - 1] || `Unknown Cable ${i}`;
                            let outputCables = outputPSCables[i - 1] || []; // Get corresponding output cables
                            page5Content += `
                                <div class="clickable-box primary"
                                     onclick='handleClick("${formattedHandhole}-G5NS (${i})", "${inputPSCable}", "", ${JSON.stringify(outputCables)})'>
                                    ${formattedHandhole}-G5NS (${i})
                                </div>`;
                        }
                
                        page5Content += `</div></div>`;
                    }
                
                    // Define input cables for each secondary splitter
                    let inputSSCables = processInputSSCablesData(connections);

                        if (!inputSSCables || inputSSCables.length === 0) {
                            inputSSCables = processInputSSCablesData(conn);
                        }
                        if (!inputSSCables || inputSSCables.length === 0) {
                            inputSSCables = processInputSSCablesData(connn);
                        }
                        if (!inputSSCables || inputSSCables.length === 0) {
                            inputSSCables = processInputSSCablesData(connnn);
                        }
                        if (!inputSSCables || inputSSCables.length === 0) {
                            inputSSCables = processInputSSCablesData(connnnn);
                        }

                     // Add more if needed
                     let outputSSCables = processOutputSSCablesData(connections);
                    if (!outputSSCables || outputSSCables.length === 0) {
                        outputSSCables = processOutputSSCablesData(conn);
                    }
                    if (!outputSSCables || outputSSCables.length === 0) {
                        outputSSCables = processOutputSSCablesData(connn);
                    }
                    if (!outputSSCables || outputSSCables.length === 0) {
                        outputSSCables = processOutputSSCablesData(connnn);
                    }
                    if (!outputSSCables || outputSSCables.length === 0) {
                        outputSSCables = processOutputSSCablesData(connnnn);
                    }
                
                    if (!isNaN(secondaryCount) && secondaryCount > 0) {
                        page5Content += `<div class="splitter-section">
                                            <h3>Secondary Splitters</h3>
                                            <div class="splitter-container">`;
                
                        for (let i = 1; i <= secondaryCount; i++) {
                            let inputSSCable = inputSSCables[i - 1] || `Unknown Cable ${i}`;
                            let outputCables = outputSSCables[i - 1] || []; // Get corresponding output cables
                            page5Content += `
                                <button class="clickable-box secondary"
                                        onclick='handleClick("${formathhHandhole} (${i})", "", "${inputSSCable}", ${JSON.stringify(outputCables)})'>

                                </button>`;

                        page5Content += `</div></div>`;
                    }
                
                    page5Content += `</div>  
                        <div id="splitterDiagram8" class="splitter-container" style="display: none;">
                            <div id="splitterTitle8">1:8 Splitter</div>

                                <div class="input-port" id="inputPort8">IN</div>
                                ${[...Array(8)].map((_, i) => `<div class="output-port" output-item-${i + 1}" id="port${i + 1}">${i + 1}</div>`).join('')}

                            <div id="outputList8" class="output-list8"></div>  <!-- New container for output cables -->
                        </div>

                        <div id="splitterDiagram4" class="splitter-container" style="display: none;">

                            <div class="splitter-small">
                                <div class="input-port" id="inputPort4">IN</div>
                                ${[...Array(4)].map((_, i) => `<div class="splitter-small output-port output-itemm-${i + 1}" id="portt${i + 1}">${i + 1}</div>`).join('')}
                            </div>
                            <div id="outputList4" class="output-list4"></div>  <!-- New container for output cables -->
                        </div>

                    </div>`;
                }
                
                // Add Page 5 only if it has content
                if (page5Content) {
                    addPage("page5", page5Content);
                }
                
               
                
                
                
                

            // If only page1 exists, hide navigation
            let navButtons = buttons.length > 1 ? `<div class="nav-buttons">${buttons.join("")}</div>` : "";

            return `
                <div class="popup-container">
                    <div class="page-content">${pages.join("")}</div>
                    ${navButtons}
                </div>
            `;
        }
        
        function createLegend() {
            const legend = L.control({ position: 'bottomright' });

            legend.onAdd = function() {
                const div = L.DomUtil.create('div', 'legend');
                div.innerHTML = `
                    <strong><span style="font-size: 30px;">Legend</strong><p>
                    <strong><span style="font-size: 15px;">Splicing info</strong><p>
                    <span class="pulse-red" style="font-size: 24px;">➔</span> Passthrough<p>
                    <span class="pulseb-blue" style="font-size: 24px;">➔</span> Splice <p>
                    <strong><span style="font-size: 15px;">Handhole types</strong><p>
                    <i class="color-box" style="background:rgba(0, 255, 0, 0.5); box-shadow:2px 0 10px rgb(0, 255, 0, 1)"></i> PS<p>
                    <i class="color-box" style="background: #ff073a; box-shadow:2px 0 10px rgb(255, 7, 58, 1) "></i> SS<p>
                    <i class="color-box" style="background: #0CAFFF;box-shadow:2px 0 10px rgb(12, 175, 255, 1)"></i> Splice<p>
                    <i class="color-box" style="background: #FF00FF;box-shadow:2px 0 10px rgb(128, 0, 128, 1)"></i> PS & SS<p>
                    <i class="color-box" style="background: rgb(255, 255, 255, 0.1);"></i> None
                `;
                return div;
            };

            legend.addTo(map);
        }

        

        function attachPopupNavigation() {
            document.addEventListener('click', function(event) {
                if (event.target.matches('.nav-buttons button')) {
                    const pageId = event.target.getAttribute('data-page');
                    showPage(pageId);
                }
            });
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.toggle('active', page.id === pageId);
            });
            document.querySelectorAll('.nav-buttons button').forEach(button => {
                button.classList.toggle('active', button.getAttribute('data-page') === pageId);
            });
        }

         // Function to update legend colors
            function updateLegendColors(isDarkTheme) {
                const legend = document.querySelector('.legend'); // Ensure this selector matches your legend's class or ID
                if (legend) {
                    if (isDarkTheme) {
                        legend.style.backgroundColor = 'transparent';
                        legend.style.color = 'white';
                        // Update colors for each item in the legend if needed
                        legend.querySelectorAll('i').forEach(function (item) {
                            if (item.style.backgroundColor === 'red') item.style.backgroundColor = '#ff6666';
                            if (item.style.backgroundColor === 'orange') item.style.backgroundColor = '#ffcc66';
                            if (item.style.backgroundColor === '#CC00FF') item.style.backgroundColor = '#e066ff';
                        });
                    } else {
                        legend.style.backgroundColor = 'transparent';
                        legend.style.color = 'black';
                        // Reset colors for each item in the legend if needed
                        legend.querySelectorAll('i').forEach(function (item) {
                            if (item.style.backgroundColor === '#ff6666') item.style.backgroundColor = 'red';
                            if (item.style.backgroundColor === '#ffcc66') item.style.backgroundColor = 'orange';
                            if (item.style.backgroundColor === '#e066ff') item.style.backgroundColor = '#CC00FF';
                        });
                    }
                }
            }

        // Listen for changes to the toggle and update the legend colors accordingly
        const themeSwitch = document.getElementById('themeSwitch');

        // Set initial state to dark theme
        map.addLayer(darkTheme); // Default to dark
        updateLegendColors(true); // Set legend to match dark theme initially

        themeSwitch.addEventListener('change', function () {
            const isDark = themeSwitch.checked;

            if (isDark) {
                map.removeLayer(lightTheme);
                map.addLayer(darkTheme);
            } else {
                map.removeLayer(darkTheme);
                map.addLayer(lightTheme);
            }

            // Directly update the legend colors based on the theme
            updateLegendColors(isDark);
        });

       // Function to highlight the selected layer
        function highlightLayer(index) {
            // Reset all layers to their original color (optional)
            layersAtPoint.forEach((layer) => {
                layer.setStyle({ color: layer.feature.properties.Layer === 'Fiber (Distribution)' ? 'orange' : 'red' });
            });

            // Set the clicked layer to blue
            layersAtPoint[index].setStyle({ color: 'blue' });
        }

       


        document.getElementById('geojsonInput1').addEventListener('change', function() {
            handleGeoJSONUpload(this, true, false);
        });

        document.getElementById('geojsonInput2').addEventListener('change', function() {
            handleGeoJSONUpload(this, false, false);
        });

        document.getElementById('geojsonInput3').addEventListener('change', function() {
            handleGeoJSONUpload(this, false, true);
        });

        map.on('popupopen', function() {
            attachPopupNavigation();
        });
    </script>
